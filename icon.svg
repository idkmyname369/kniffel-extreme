<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="sky" cx="50%" cy="72%" r="75%">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="0.18" stop-color="#ff5a1f"/>
      <stop offset="0.42" stop-color="#9e1a12"/>
      <stop offset="0.75" stop-color="#2a0807"/>
      <stop offset="1" stop-color="#0c0505"/>
    </radialGradient>
    <linearGradient id="bone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6e6"/>
      <stop offset="0.55" stop-color="#e8dcc6"/>
      <stop offset="1" stop-color="#a99a83"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffd36b"/>
      <stop offset="0.45" stop-color="#ff7a1a"/>
      <stop offset="1" stop-color="#ff2a00" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#000" flood-opacity="0.7"/>
    </filter>
    <clipPath id="dieclip"><rect x="292" y="262" width="440" height="440" rx="96"/></clipPath>
  </defs>

  <rect width="1024" height="1024" fill="url(#sky)"/>

  <!-- fireball / mushroom glow -->
  <circle cx="512" cy="560" r="300" fill="#ff7b22" opacity="0.55" filter="url(#soft)"/>

  <!-- flames rising behind the die -->
  <g opacity="0.95"><g filter="url(#soft)" opacity="0.7"><g fill="url(#flame)"><path d="M100 870 C100 721.5 182.5 688.5 226.5 540 C259.5 672.0 320 738.0 320 870 Z"/><path d="M180 870 C180 658.5 270.0 611.5 318.0 400 C354.0 588.0 420 682.0 420 870 Z"/><path d="M270 870 C270 618.0 360.0 562.0 408.0 310 C444.0 534.0 510 646.0 510 870 Z"/><path d="M340 870 C340 591.0 437.5 529.0 489.5 250 C528.5 498.0 600 622.0 600 870 Z"/><path d="M430 870 C430 600.0 527.5 540.0 579.5 270 C618.5 510.0 690 630.0 690 870 Z"/><path d="M530 870 C530 636.0 620.0 584.0 668.0 350 C704.0 558.0 770 662.0 770 870 Z"/><path d="M625 870 C625 676.5 711.25 633.5 757.25 440 C791.75 612.0 855 698.0 855 870 Z"/><path d="M720 870 C720 735.0 795.0 705.0 835.0 570 C865.0 690.0 920 750.0 920 870 Z"/></g></g><g fill="url(#flame)"><path d="M100 870 C100 721.5 182.5 688.5 226.5 540 C259.5 672.0 320 738.0 320 870 Z"/><path d="M180 870 C180 658.5 270.0 611.5 318.0 400 C354.0 588.0 420 682.0 420 870 Z"/><path d="M270 870 C270 618.0 360.0 562.0 408.0 310 C444.0 534.0 510 646.0 510 870 Z"/><path d="M340 870 C340 591.0 437.5 529.0 489.5 250 C528.5 498.0 600 622.0 600 870 Z"/><path d="M430 870 C430 600.0 527.5 540.0 579.5 270 C618.5 510.0 690 630.0 690 870 Z"/><path d="M530 870 C530 636.0 620.0 584.0 668.0 350 C704.0 558.0 770 662.0 770 870 Z"/><path d="M625 870 C625 676.5 711.25 633.5 757.25 440 C791.75 612.0 855 698.0 855 870 Z"/><path d="M720 870 C720 735.0 795.0 705.0 835.0 570 C865.0 690.0 920 750.0 920 870 Z"/></g></g>

  <!-- ruined skyline -->
  <path d="M0 1024 L0 800 L60 800 L60 760 L110 760 L110 820 L150 820 L150 730 L175 715 L200 730 L200 845 L860 845 L860 740 L890 740 L895 700 L930 700 L930 780 L970 780 L975 735 L1024 735 L1024 1024 Z" fill="#0b0505"/>
  <path d="M0 1024 L0 880 L1024 880 L1024 1024 Z" fill="#070303"/>

  <!-- ash particles -->
  <g fill="#ffcf8a" opacity="0.8">
    <circle cx="160" cy="220" r="5"/><circle cx="830" cy="180" r="6"/><circle cx="900" cy="420" r="4"/>
    <circle cx="120" cy="520" r="4"/><circle cx="760" cy="250" r="3"/><circle cx="260" cy="140" r="3"/>
    <circle cx="700" cy="120" r="4"/><circle cx="940" cy="300" r="3"/><circle cx="90" cy="380" r="3"/>
  </g>

  <!-- the die -->
  <g transform="rotate(-14 512 482)" filter="url(#shadow)">
    <rect x="292" y="262" width="440" height="440" rx="96" fill="url(#bone)"/>
    <g clip-path="url(#dieclip)">
      <!-- burned edge -->
      <path d="M292 640 C360 600 420 680 500 650 C580 620 640 700 732 650 L732 702 L292 702 Z" fill="#3a1a10" opacity="0.55"/>
      <!-- glowing cracks -->
      <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
        <path d="M520 262 L500 340 L540 400 L505 470 L560 540 L530 610 L575 702" stroke="#ff6a00" stroke-width="16"/>
        <path d="M520 262 L500 340 L540 400 L505 470 L560 540 L530 610 L575 702" stroke="#ffd27a" stroke-width="6"/>
        <path d="M540 400 L620 420 L690 390" stroke="#ff6a00" stroke-width="11"/>
        <path d="M540 400 L620 420 L690 390" stroke="#ffd27a" stroke-width="4"/>
        <path d="M505 470 L430 500 L380 470 L320 500" stroke="#ff6a00" stroke-width="10"/>
        <path d="M505 470 L430 500 L380 470 L320 500" stroke="#ffd27a" stroke-width="4"/>
      </g>
    </g>
    <!-- pips: 4 corners -->
    <g fill="#1a0a08">
      <circle cx="392" cy="362" r="40"/><circle cx="632" cy="362" r="40"/>
      <circle cx="392" cy="602" r="40"/><circle cx="632" cy="602" r="40"/>
    </g>
    <!-- center pip as skull -->
    <g transform="translate(512 482)">
      <path d="M-50 -10 C-50 -48 -25 -66 0 -66 C25 -66 50 -48 50 -10 C50 14 38 26 30 32 L30 52 L-30 52 L-30 32 C-38 26 -50 14 -50 -10 Z" fill="#1a0a08"/>
      <circle cx="-20" cy="-8" r="15" fill="#ff7a1a" filter="url(#glow)"/>
      <circle cx="20" cy="-8" r="15" fill="#ff7a1a" filter="url(#glow)"/>
      <path d="M0 10 L-8 26 L8 26 Z" fill="#e8dcc6"/>
      <g stroke="#e8dcc6" stroke-width="5"><line x1="-15" y1="38" x2="-15" y2="52"/><line x1="0" y1="38" x2="0" y2="52"/><line x1="15" y1="38" x2="15" y2="52"/></g>
    </g>
  </g>
</svg>

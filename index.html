<html lang="de">

<title>Kniffel Royale</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@600;700&family=Bungee&display=swap" rel="stylesheet">
<style>
:root{--bg:#1d1e21;--card:#2c2d32;--card2:#36373d;--card3:#404248;--navy:#1f4c98;--navy2:#173a78;--sep:rgba(255,255,255,.075);--text:#f5f5f7;--sec:#9a9aa1;--ter:#66676d;--blue:#0a84ff;--green:#30d158;--red:#ff453a;--orange:#ff9f0a;--purple:#bf5af2;--teal:#40c8e0;--pink:#ff375f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}body{margin:0;background:transparent}html{margin:0}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--bg) url(bg.jpg?v=1) center/cover no-repeat;pointer-events:none;transform:translateZ(0);will-change:transform}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;letter-spacing:-.011em;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer;font-size:17px;padding:0;letter-spacing:inherit}
button:disabled{cursor:default}
.eyebrow{font-size:13px;font-weight:600;color:var(--sec);text-transform:uppercase;letter-spacing:.04em}
.large{font-size:34px;font-weight:700;letter-spacing:-.025em;margin:2px 0 4px;line-height:1.1}
.lead{color:var(--sec);font-size:15px;margin:0 0 26px;line-height:1.4}
.gtitle{display:flex;justify-content:space-between;align-items:flex-end;font-size:13px;color:var(--sec);text-transform:uppercase;letter-spacing:.03em;padding:0 16px 7px}
.gtitle .links button{color:var(--blue);font-size:15px;text-transform:none;letter-spacing:-.01em;margin-left:14px}
.gfoot{font-size:13px;color:var(--ter);padding:7px 16px 0;line-height:1.4}
.group{background:var(--card);border-radius:14px;overflow:hidden}
.block{margin-bottom:26px}
.sub-h{font-size:12px;color:var(--ter);text-transform:uppercase;letter-spacing:.05em;padding:12px 16px 4px;font-weight:600}
.cell{display:flex;align-items:center;min-height:50px;padding:11px 16px;gap:13px;position:relative;width:100%;text-align:left}
.cell+.cell::before,.sub-h+.cell::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--sep)}
.sub-h+.cell::before{display:none}
.cell .grow{flex:1;min-width:0}
.ct{font-size:16px;font-weight:500}
.cs{font-size:13px;color:var(--sec);margin-top:2px;line-height:1.35}
.cell.off .ct,.cell.off .cs,.cell.off .glyph{opacity:.35}
input[type=text],input[type=number]{font-family:inherit;font-size:17px;background:transparent;border:0;color:var(--text);outline:none;width:100%;padding:0;letter-spacing:-.01em}
input::placeholder{color:var(--ter)}
.lvlbtn{flex:none;margin:0 8px;padding:5px 10px;border-radius:8px;font-size:12px;font-weight:700;min-width:64px;background:var(--card3);color:var(--text)}.lvlbtn.lv0{color:#8fd18f}.lvlbtn.lv2{color:#ffcf6a}
.intro{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity .25s}.intro.in{opacity:1}
.introbox{position:relative;width:100%;max-width:400px;background:var(--card);border-radius:20px;padding:30px 22px 20px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.introskip{position:absolute;top:12px;right:14px;color:var(--blue);font-size:15px}
.introi{font-size:52px;line-height:1;margin:8px 0 14px}.introt{font-family:Lora,Georgia,serif;font-size:23px;font-weight:700;margin-bottom:10px}
.introx{font-size:15.5px;line-height:1.5;color:var(--sec);min-height:168px;text-align:left}.introx b{color:var(--text)}
.introdots{display:flex;justify-content:center;gap:7px;margin:16px 0}.introdots span{width:7px;height:7px;border-radius:50%;background:var(--ter);opacity:.5}.introdots span.on{background:var(--text);opacity:1}
html,body{touch-action:manipulation}
.btn.wa{background:#25D366;color:#fff;box-shadow:0 4px 14px rgba(37,211,102,.25)}
.frrow{padding:0;overflow:hidden;gap:0}.frin{display:flex;align-items:center;gap:4px;width:100%;min-height:50px;padding:8px 16px;background:var(--card);position:relative;z-index:1;transition:transform .22s ease}.frrow.drag .frin{transition:none}.frdel{position:absolute;right:0;top:0;bottom:0;width:96px;background:#ff453a;color:#fff;font-size:15px;font-weight:600}.frrow.gone{transition:max-height .25s ease,opacity .25s;max-height:0!important;min-height:0;opacity:0}.frstar{flex:none;width:34px;height:34px;font-size:21px;color:var(--ter);margin-left:-6px}.frstar.on{color:#ffcf6a}
.frname{text-align:left;min-height:34px;display:flex;align-items:center}.frname:disabled{opacity:.55}.frstate.here{color:var(--sec)}.frstate{flex:none;font-size:14px;color:var(--blue)}.frstate.ok{color:#30d158}
.intro.joincover{background:rgba(18,18,20,.97);z-index:400}.jcbox{display:flex;flex-direction:column;align-items:center;gap:18px}.jct{font-size:17px;font-weight:600}.jcspin{width:42px;height:42px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:#ffcf6a;animation:jcs .8s linear infinite}@keyframes jcs{to{transform:rotate(360deg)}}.jccancel{color:var(--sec);font-size:15px;margin-top:10px}
.rxbtn{position:absolute;right:6px;top:-54px;width:44px;height:44px;border-radius:50%;font-size:24px;background:var(--card2);box-shadow:0 4px 14px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.06)}.rxbtn.rxfixed{position:fixed;top:auto;right:16px;bottom:calc(env(safe-area-inset-bottom) + 18px);z-index:20}.dicebox.locked>.rxbtn{opacity:1;filter:none;pointer-events:auto}
.rxbar{position:fixed;right:12px;top:110px;z-index:250;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:8px;background:var(--card2,#2c2c2e);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;transform:scale(.9);transform-origin:bottom right;transition:opacity .15s,transform .15s}.rxbar.in{opacity:1;transform:none}.rxbar button{font-size:28px;width:48px;height:48px;border-radius:12px}.rxbar button:active{background:rgba(255,255,255,.1)}
.rxfly{position:fixed;bottom:18%;z-index:260;pointer-events:none;text-align:center;animation:rxup 2.6s ease-out forwards}.rxe{font-size:56px;line-height:1;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4))}.rxn{font-size:13px;font-weight:600;margin-top:4px;background:rgba(0,0,0,.55);border-radius:8px;padding:2px 8px;display:inline-block}
@keyframes rxup{0%{opacity:0;transform:translateY(20px) scale(.6)}12%{opacity:1;transform:translateY(0) scale(1.1)}20%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-38vh)}}
.profcard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border-radius:16px;padding:12px 14px;margin:6px 0 4px;border:1px solid rgba(255,255,255,.05)}
.lvbadge{flex:none;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px;color:#1b1406;background:radial-gradient(circle at 35% 30%,#fff3c4,#e8b84a 45%,#9a6a14);box-shadow:0 0 0 2px rgba(255,215,106,.35),0 4px 12px rgba(0,0,0,.4)}
.lvbadge.t0{background:radial-gradient(circle at 35% 30%,#f2f2f2,#a9adb5 45%,#5d626b);color:#16181c;box-shadow:0 0 0 2px rgba(255,255,255,.2),0 4px 12px rgba(0,0,0,.4)}
.lvbadge.t1{background:radial-gradient(circle at 35% 30%,#ffe2c4,#d08a4a 45%,#7c4618)}
.lvbadge.t3,.lvbadge.t4{background:radial-gradient(circle at 35% 30%,#d6f0ff,#4aa3e8 45%,#14509a);color:#fff}
.lvbadge.t5,.lvbadge.t6{background:radial-gradient(circle at 35% 30%,#f3d6ff,#b04ae8 45%,#5a149a);color:#fff}
.lvbadge.t7,.lvbadge.t8,.lvbadge.t9{background:radial-gradient(circle at 35% 30%,#ffd6d6,#e84a4a 45%,#8a1010);color:#fff;box-shadow:0 0 0 2px rgba(255,120,120,.4),0 0 18px rgba(255,80,80,.35)}
.lvbadge.big{width:84px;height:84px;font-size:34px;margin:0 auto}
.pcn{font-weight:700;font-size:17px}.pct{font-weight:600;font-size:13px;color:#ffcf6a;margin-left:4px}.pcs{font-size:12.5px;color:var(--sec);margin-top:4px}
.xpbar{height:7px;border-radius:5px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:6px}.xpbar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#e8b84a,#ffe08a)}.xpbar.big{height:10px;margin:14px 0 8px}
.profhero{background:var(--card);border-radius:18px;padding:22px 18px;text-align:center}.ph-t{font-family:Lora,Georgia,serif;font-size:22px;font-weight:700;margin-top:10px;color:#ffcf6a}
.aicon{width:26px;display:flex;justify-content:center;font-size:18px}
.xpgain{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:16px;padding:12px 14px;margin:14px 0;border:1px solid rgba(255,215,106,.25)}.xg-t{font-weight:800;font-size:18px;color:#ffcf6a}
.xpgain.anim{animation:xgin .5s 2.4s both}.xpgain.anim .xpbar i{animation:xgbar 1.2s 2.9s both}
@keyframes xgin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes xgbar{from{width:var(--from)}}
.lvup{text-align:center;padding:10px 0 6px}.lvup h2{margin-top:14px}
.stepper{display:flex;align-items:center;background:var(--card3);border-radius:9px;overflow:hidden}
.stepper button{width:44px;height:32px;font-size:20px;color:var(--text)}
.stepper b{min-width:26px;text-align:center;font-weight:600;font-size:16px}
.seg{display:flex;background:#16171a;border-radius:10px;padding:2px;margin:12px 16px}
.seg button{flex:1;padding:8px 6px;border-radius:8px;font-size:14px;font-weight:600;color:var(--sec)}
.seg button.on{background:var(--card3);color:var(--text);box-shadow:0 2px 6px rgba(0,0,0,.35)}
.sw{width:51px;height:31px;border-radius:16px;background:#48494f;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:transform .2s}
.sw.on{background:var(--green)}
.sw.on::after{transform:translateX(20px)}
.glyph{width:38px;height:38px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;letter-spacing:-.03em}
.g-wuerfe{background:rgba(10,132,255,.16);color:#4da3ff}
.g-wertung{background:rgba(255,159,10,.16);color:#ffb340}
.g-bonus{background:rgba(191,90,242,.17);color:#d18cf7}
.g-spezial{background:rgba(255,55,95,.16);color:#ff6b88}
.g-verdeckt{background:rgba(64,200,224,.15);color:#6bd8eb}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:14px;font-size:17px;font-weight:600;background:var(--blue);color:#fff;transition:opacity .15s,transform .1s}
.btn:active:not(:disabled){transform:scale(.985);opacity:.85}
.btn:disabled{opacity:.35}
.btn.gray{background:var(--card2);color:var(--text)}
.btn.tint{background:linear-gradient(rgba(10,132,255,.15),rgba(10,132,255,.15)),var(--bg);color:var(--blue)}
.btn.red{background:var(--red)}
.btnrow{display:flex;gap:10px}
.sticky{position:sticky;bottom:0;z-index:5;padding:14px 0 calc(14px + env(safe-area-inset-bottom));margin-top:-10px}.sticky::before{content:'';position:absolute;left:0;right:0;top:var(--gt,0);bottom:var(--gb,0);z-index:-1;background:linear-gradient(to top,rgba(29,30,33,.94) 60%,rgba(29,30,33,0));pointer-events:none}.sticky.atend::before{opacity:0}
/* game */
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.iconbtn{height:34px;padding:0 13px;border-radius:17px;background:var(--card2);font-size:14px;font-weight:600;color:var(--text)}
.standings{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 18px;padding:0 16px;scrollbar-width:none}
.standings::-webkit-scrollbar{display:none}
.st{flex:none;background:var(--card);border-radius:12px;padding:8px 13px;min-width:84px}
.st .n{font-size:12px;color:var(--sec);white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis}
.st .p{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.st.on{background:var(--text);color:#111}
.st.on .n{color:#555}
.deck{width:100%;border-radius:18px;padding:22px 18px;margin-bottom:16px;background:linear-gradient(150deg,#34363c,#26272b);border:1px solid rgba(255,255,255,.09);display:flex;align-items:center;gap:16px;text-align:left;box-shadow:0 10px 30px rgba(0,0,0,.25);position:relative;overflow:hidden}
.deck::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.06) 50%,transparent 70%);animation:shine 3s infinite}
@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.stack{width:46px;height:60px;position:relative;flex:none}
.stack i{position:absolute;inset:0;border-radius:8px;background:linear-gradient(150deg,#4a4c53,#3a3b41);border:1px solid rgba(255,255,255,.14)}
.stack i:nth-child(1){transform:rotate(-8deg) translate(-3px,1px)}
.stack i:nth-child(2){transform:rotate(4deg) translate(2px,0)}
.stack i:nth-child(3){background:linear-gradient(150deg,#0a84ff,#5e5ce6);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:#fff}
.deck .t{font-size:19px;font-weight:600}
.deck .s{font-size:14px;color:var(--sec);margin-top:3px}
@keyframes flip{from{transform:perspective(700px) rotateY(80deg);opacity:0}to{transform:none;opacity:1}}
.evt{font-size:17px;font-weight:600}
.evx{font-size:14px;color:var(--sec);line-height:1.4;margin-top:2px}
.evnote{font-size:14px;color:var(--text);margin-top:8px;line-height:1.4}
.evcard .btn{height:40px;font-size:15px;margin-top:12px;border-radius:11px}
.locked{pointer-events:none}
.locked>*{opacity:.35;filter:saturate(.6)}
.dicebox{background:var(--card);border-radius:18px;padding:18px 14px 14px;margin-bottom:22px}
.dice{display:flex;justify-content:center;gap:6px;margin-bottom:24px;--ds:min(46px,calc((100vw - 96px) / 6))}
.die{flex:none;width:var(--ds);height:var(--ds);border-radius:24%;background:linear-gradient(160deg,#ffffff,#e4e4ea);box-shadow:0 3px 8px rgba(0,0,0,.4),inset 0 -2px 0 rgba(0,0,0,.08);padding:0;position:relative;display:block;overflow:visible;transition:transform .15s,box-shadow .15s}
.die.blank{background:var(--card3);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.die.held{transform:translateY(-5px);box-shadow:0 0 0 2.5px var(--blue),0 8px 16px rgba(0,0,0,.4)}
.die.held::after{content:"Gehalten";position:absolute;left:-6px;right:-6px;bottom:-21px;font-size:10px;font-weight:600;color:var(--blue);text-align:center}
.die.jok{box-shadow:0 0 0 2.5px var(--purple),0 6px 14px rgba(0,0,0,.4)}
.die.roll{animation:roll .5s cubic-bezier(.2,.8,.2,1)}
@keyframes roll{0%{transform:rotate(-40deg) scale(.7);opacity:.4}60%{transform:rotate(8deg) scale(1.05)}100%{transform:none}}
.pips{position:absolute;inset:0;display:block;z-index:2}
.pips i{position:absolute;width:20%;height:20%;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 40% 35%,#3a3a3c,#111)}
.rollrow{display:flex;gap:10px}
.rollrow .btn{flex:1}
.rollrow .jk{flex:0 0 auto;width:auto;padding:0 18px;background:rgba(191,90,242,.18);color:#d18cf7}
.hint{font-size:13px;color:var(--sec);text-align:center;margin-top:10px;min-height:17px}
.row{display:flex;align-items:center;width:100%;min-height:54px;padding:9px 16px;gap:12px;text-align:left;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--sep)}
.row .grow{flex:1;min-width:0}
.rn{font-size:16px;font-weight:500}
.rh{font-size:12.5px;color:var(--sec);margin-top:1px}
.rv{display:flex;align-items:center;gap:7px;font-variant-numeric:tabular-nums}
.val{font-size:17px;font-weight:600}
.row.done .rn{color:var(--sec)}
.row.done .val{color:var(--text)}
.row.dim{opacity:.32}
.pv{font-size:16px;font-weight:600;color:var(--blue);background:rgba(10,132,255,.13);border-radius:8px;padding:3px 10px;min-width:40px;text-align:center}
.pv.zero{color:var(--ter);background:var(--card2)}
.chev{color:var(--ter);font-size:20px;font-weight:400}
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px;background:rgba(255,159,10,.17);color:#ffb340}
.tag.neg{background:rgba(255,69,58,.17);color:#ff6961}
.sumrow{display:flex;justify-content:space-between;padding:12px 16px;font-size:15px;color:var(--sec);border-top:1px solid var(--sep)}
.sumrow b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.sumrow.ok b{color:var(--green)}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.ov.keep,.ov.keep .sheet{animation:none!important}
.sheet{background:#26272b;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.8,.2,1);max-height:92vh;overflow:auto;border-top:1px solid rgba(255,255,255,.06)}
@keyframes up{from{transform:translateY(60px);opacity:.5}}
.grab{width:36px;height:5px;border-radius:3px;background:#55565c;margin:0 auto 14px}
.sheet h2{font-size:22px;font-weight:700;margin:0 0 3px;letter-spacing:-.02em}
.sheet .muted{color:var(--sec);font-size:14px;margin:0 0 16px;line-height:1.4}

.calc .note{margin-top:8px;color:#6bd8eb;font-size:13.5px}
.quick{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.quick button{background:var(--card2);font-size:15px;font-weight:600;padding:9px 14px;border-radius:10px}
.quick button.on{background:var(--blue)}
.field{background:var(--card2);border-radius:12px;padding:14px 16px;margin-bottom:8px}
.err{color:var(--red);font-size:13.5px;min-height:18px;margin-bottom:6px}
.pick{background:var(--card2);border-radius:14px;overflow:hidden;margin-bottom:16px;max-height:46vh;overflow-y:auto}
.pick .sub-h{background:var(--card2);position:sticky;top:0;z-index:1}
.pick .cell.sel{background:rgba(10,132,255,.16)}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid #5a5b61;flex:none}
.sel .radio{border:7px solid var(--blue)}
.reveal{text-align:center;padding:6px 0 4px}
.reveal .glyph{width:72px;height:72px;font-size:22px;border-radius:18px;margin:0 auto 14px;animation:flip .6s cubic-bezier(.2,.8,.2,1)}
.bigdie{position:relative;width:84px;height:84px;margin:6px auto 12px;border-radius:22%;background:linear-gradient(160deg,#fff,#e4e4ea);box-shadow:0 6px 18px rgba(0,0,0,.5)}
.bigdie.spin{animation:spin .25s linear infinite;filter:blur(1.2px)}
@keyframes spin{to{transform:rotate(360deg)}}

function baseFinal(p,t,raw,rolls,id){const ev=evOf(t),parts=[],c=id?CAT[id]:null,onBet=!!(t.bet&&id&&t.bet.cats.includes(id));
 if(!raw||raw<=0){if(onBet)return{f:-t.bet.stake,parts:['Wette −'+t.bet.stake]};return{f:0,parts}}let f=raw;
 if(t.voidMult){f=Math.floor(f*t.voidMult);parts.push('×'+t.voidMult)}

 if(ev&&ev.hattrick&&(['hw','kn','ke'].includes(id)||(S.mode==='digital'&&maxC(t.dice)>=5)||(c&&c.face&&raw>=c.face*5))){f+=100;parts.push('+100')}

function pickOptions(kind){const me=S.players[S.cur],t=S.turn,out=[];

function applyAfter(entry,kind,cid,ctx,p){const c=CAT[cid],dig=S.mode==='digital',t=S.turn;const res={before:entry.final,text:''};

  case'pionier':{const first=entry.raw>0&&!others.some(q=>q.sc[cid]&&q.sc[cid].final>0);p.adj+=first?20:-20;res.text=first?'Du bist der Erste – +20 Punkte!':'Nicht der Erste – −20 Punkte.';break}
  case'thief':{const am=Math.max(0,entry.final);if(am>0&&ctx.target!=null){const q=S.players[ctx.target];q.adj-=am;res.text=esc(q.name)+' verliert '+am+' Punkte.'}else res.text='Nichts zu stehlen.';break}
  case'gift':{const rcv=(ctx.target!=null&&S.players[ctx.target]&&S.players[ctx.target]!==p)?S.players[ctx.target]:others.slice().sort((a,b)=>totals(a).total-totals(b).total)[0];const g=Math.max(0,entry.final);rcv.adj+=g;entry.final=0;if(g)entry.tag='→';res.text=g?esc(rcv.name)+' bekommt deine '+g+' Punkte.':'Es gab nichts zu verschenken.';break}
  case'share':{let given=0;for(const q of others){const g=Math.max(0,Math.min(10,entry.final));entry.final-=g;q.adj+=g;given+=g}if(given)addTag(entry,'−'+given);res.text=given?'Deine Mitspieler bekommen zusammen '+given+' Punkte.':'Es gab nichts zu teilen.';break}
  case'mix':res.text=ctx.mixId?'Deine Wertung landet in „'+CAT[ctx.mixId].name+'“.':'Keine andere Kategorie frei – die Wertung bleibt.';break;
  case'wheel':{const opts=[10,25,50,100,'x2'],o=rnd(opts);res.wheel=o;if(o==='x2'){entry.final*=2;if(entry.final)addTag(entry,'×2');res.text='Das Rad zeigt ×2 – deine Wertung zählt doppelt.'}else{entry.final+=o;addTag(entry,'+'+o);res.text='Das Rad zeigt +'+o+' Punkte!'}break}
  case'slots':{const reels=ctx.reels||[0,1,2].map(()=>rnd(SLOT_SYM));let v=entry.final;const steps=[String(v)];for(const r of reels){v=r==='+25'?v+25:v*(r==='×2'?2:3);steps.push(r+' = '+v)}entry.final=v;addTag(entry,'777');res.reels=reels;res.text=steps.join(' → ')+(reels.every(r=>r==='×3')?' – MAXIMALER JACKPOT!':'');break}

  case'nexthalf':p.half=true;res.text='Deine nächste Wertung zählt nur die Hälfte.';break;
 }

function jdiff(a,b,p,o){if(a===b)return o;const oa=a!==null&&typeof a==='object',ob=b!==null&&typeof b==='object';
 if(oa&&ob&&Array.isArray(a)===Array.isArray(b)){if(Array.isArray(a)){if(b.length<a.length){o.push([p,b]);return o}for(let i=0;i<b.length;i++)jdiff(a[i],b[i],p.concat(i),o);return o}
  for(const k in a)if(!(k in b))o.push([p.concat(k)]);for(const k in b)jdiff(a[k],b[k],p.concat(k),o);return o}
 o.push([p,b===undefined?null:b]);return o}
function japply(o,ops){for(const op of ops){const p=op[0];if(!p.length){o=op[1];continue}let c=o;for(let i=0;i<p.length-1;i++){const k=p[i];if(c[k]==null||typeof c[k]!=='object')c[k]=typeof p[i+1]==='number'?[]:{};c=c[k]}const k=p[p.length-1];if(op.length===1){if(Array.isArray(c))c[k]=null;else delete c[k]}else c[k]=op[1]}return o}
function mpState(d){if(!d||typeof d.json!=='string')return null;let st;try{st=JSON.parse(d.json)}catch(e){return null}
 const dl=d.dl;if(dl&&typeof dl==='object'){const L={};for(const k in dl){try{const x=JSON.parse(dl[k]);if(x&&x.o)L[x.b]=x}catch(e){}}let g=0;while(L[st.rev||0]&&g++<60){const x=L[st.rev||0];st=japply(st,x.o);st.rev=x.r}}
 return st}

const JP=(()=>{try{const q=new URLSearchParams(location.search),c=(q.get('join')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6),g=(q.get('game')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6),inv=q.has('inv');if(c||inv||g)history.replaceState(null,'',location.pathname);return{c,inv,g}}catch(e){return{c:'',inv:false,g:''}}})();
function openByCode(code){if(!code)return;if(S&&S.online&&S.online.code===code&&view==='game')return;if(!openGame('mp-'+code))toast('Spiel nicht gefunden')}
function joinCover(on,txt){let el=document.querySelector('.joincover');if(!on){if(el){el.classList.remove('in');setTimeout(()=>el.remove(),250)}return}
 if(!el){el=document.createElement('div');el.className='intro joincover';el.innerHTML='<div class="jcbox"><div class="jcspin"></div><div class="jct"></div><button class="jccancel">Abbrechen</button></div>';document.body.appendChild(el);el.classList.add('in');el.querySelector('.jccancel').onclick=()=>{ui.autoInv=0;JP.c='';joinCover(false)}}
 el.querySelector('.jct').textContent=txt||'Einladung wird geöffnet …'}
function invWait(){ui.autoInv=Date.now();const t0=ui.autoInv;joinCover(true);setTimeout(()=>{if(ui.autoInv===t0){ui.autoInv=0;joinCover(false);toast('Keine offene Einladung gefunden')}},15000)}
if(JP.c){setup.joinCode=JP.c;view='join';if((setup.myName||'').trim())joinCover(true,'Trete der Lobby bei …')}if(JP.inv)invWait();if(JP.g)joinCover(true,'Spiel wird geöffnet …');
if('serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',m=>{if(m.data&&m.data.kx==='inv'){invWait();showInvites()}if(m.data&&m.data.kx==='game')openByCode(String(m.data.code||'').toUpperCase())});
function frBackfill(){try{if(localStorage.getItem('kx-fr-bf'))return;Object.values(GAMES).forEach(g=>{try{const r=JSON.parse(g.json);if(!r.online)return;const st={};r.players.forEach(q=>{if(q.uid)st[q.uid]={name:q.name}});frRecord(st)}catch(e){}});localStorage.setItem('kx-fr-bf','1')}catch(e){}}
async function afterCloud(){if(GRET&&UID)await googleFinish();if(UID){rememberUid();await cloudPull(false);xpBackfill();frBackfill();if(view==='home'&&!S){const a=document.getElementById('app'),pc=a&&a.querySelector('.profcard'),old=pc?pc.outerHTML:'';if(profileCard()!==old||cloudPull.changed)render()}}invListen();pushRefresh();if(JP.g){openByCode(JP.g);JP.g='';joinCover(false)}if(JP.c&&(setup.myName||'').trim()&&!(MP&&MP.lobby&&MP.lobby.code===JP.c)){try{await mpJoin()}catch(e){}joinCover(false)}}

/* Wischen zum Löschen (Mitspieler-Liste) */
(()=>{let row=null,x0=0,y0=0,dx=0,base=0,mode=null;const W=96;
 const close=except=>document.querySelectorAll('.frrow.open').forEach(r=>{if(r!==except){r.classList.remove('open');r.querySelector('.frin').style.transform=''}});
 document.addEventListener('touchstart',e=>{const r=e.target.closest('.frrow');if(!r){close();return}if(e.target.closest('.frdel'))return;close(r);row=r;x0=e.touches[0].clientX;y0=e.touches[0].clientY;dx=0;mode=null;base=r.classList.contains('open')?-W:0},{passive:true});
 document.addEventListener('touchmove',e=>{if(!row)return;const t=e.touches[0],mx=t.clientX-x0,my=t.clientY-y0;
  if(!mode){if(Math.abs(mx)<8&&Math.abs(my)<8)return;mode=Math.abs(mx)>Math.abs(my)?'x':'y';if(mode==='x')row.classList.add('drag')}
  if(mode!=='x')return;e.preventDefault();dx=Math.min(0,base+mx);row.querySelector('.frin').style.transform='translateX('+dx+'px)'},{passive:false});
 document.addEventListener('touchend',()=>{if(!row)return;const r=row;row=null;r.classList.remove('drag');if(mode!=='x'){return}
  const inn=r.querySelector('.frin'),w=r.offsetWidth;
  if(dx<-w*0.55){inn.style.transform='translateX(-100%)';r.style.maxHeight=r.offsetHeight+'px';requestAnimationFrame(()=>r.classList.add('gone'));setTimeout(()=>{const f=frLoad(),k=r.querySelector('.frdel').dataset.k;if(f[k]){delete f[k];frSave(f)}render()},260)}
  else if(dx<-W/2){r.classList.add('open');inn.style.transform='translateX(-'+W+'px)'}
  else{r.classList.remove('open');inn.style.transform=''}
  const stop=ev=>{ev.stopPropagation();ev.preventDefault()};document.addEventListener('click',stop,{capture:true,once:true});setTimeout(()=>document.removeEventListener('click',stop,{capture:true}),60)});
})();

render();
initCloud().then(afterCloud);
</script>

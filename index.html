<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d1e21">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kniffel">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<title>Kniffel Extreme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1d1e21;--card:#28292d;--card2:#323338;--card3:#3b3d43;--sep:rgba(255,255,255,.075);--text:#f5f5f7;--sec:#9a9aa1;--ter:#66676d;--blue:#0a84ff;--green:#30d158;--red:#ff453a;--orange:#ff9f0a;--purple:#bf5af2;--teal:#40c8e0;--pink:#ff375f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;letter-spacing:-.011em;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:22px 16px 40px}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer;font-size:17px;padding:0;letter-spacing:inherit}
button:disabled{cursor:default}
.eyebrow{font-size:13px;font-weight:600;color:var(--sec);text-transform:uppercase;letter-spacing:.04em}
.large{font-size:34px;font-weight:700;letter-spacing:-.025em;margin:2px 0 4px;line-height:1.1}
.lead{color:var(--sec);font-size:15px;margin:0 0 26px;line-height:1.4}
.gtitle{display:flex;justify-content:space-between;align-items:flex-end;font-size:13px;color:var(--sec);text-transform:uppercase;letter-spacing:.03em;padding:0 16px 7px}
.gtitle .links button{color:var(--blue);font-size:15px;text-transform:none;letter-spacing:-.01em;margin-left:14px}
.gfoot{font-size:13px;color:var(--ter);padding:7px 16px 0;line-height:1.4}
.group{background:var(--card);border-radius:14px;overflow:hidden}
.block{margin-bottom:26px}
.sub-h{font-size:12px;color:var(--ter);text-transform:uppercase;letter-spacing:.05em;padding:12px 16px 4px;font-weight:600}
.cell{display:flex;align-items:center;min-height:50px;padding:11px 16px;gap:13px;position:relative;width:100%;text-align:left}
.cell+.cell::before,.sub-h+.cell::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--sep)}
.sub-h+.cell::before{display:none}
.cell .grow{flex:1;min-width:0}
.ct{font-size:16px;font-weight:500}
.cs{font-size:13px;color:var(--sec);margin-top:2px;line-height:1.35}
.cell.off .ct,.cell.off .cs,.cell.off .glyph{opacity:.35}
input[type=text],input[type=number]{font-family:inherit;font-size:17px;background:transparent;border:0;color:var(--text);outline:none;width:100%;padding:0;letter-spacing:-.01em}
input::placeholder{color:var(--ter)}
.stepper{display:flex;align-items:center;background:var(--card3);border-radius:9px;overflow:hidden}
.stepper button{width:44px;height:32px;font-size:20px;color:var(--text)}
.stepper b{min-width:26px;text-align:center;font-weight:600;font-size:16px}
.seg{display:flex;background:#16171a;border-radius:10px;padding:2px;margin:12px 16px}
.seg button{flex:1;padding:8px 6px;border-radius:8px;font-size:14px;font-weight:600;color:var(--sec)}
.seg button.on{background:var(--card3);color:var(--text);box-shadow:0 2px 6px rgba(0,0,0,.35)}
.sw{width:51px;height:31px;border-radius:16px;background:#48494f;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:transform .2s}
.sw.on{background:var(--green)}
.sw.on::after{transform:translateX(20px)}
.glyph{width:38px;height:38px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;letter-spacing:-.03em}
.g-wuerfe{background:rgba(10,132,255,.16);color:#4da3ff}
.g-wertung{background:rgba(255,159,10,.16);color:#ffb340}
.g-bonus{background:rgba(191,90,242,.17);color:#d18cf7}
.g-spezial{background:rgba(255,55,95,.16);color:#ff6b88}
.g-verdeckt{background:rgba(64,200,224,.15);color:#6bd8eb}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:52px;border-radius:14px;font-size:17px;font-weight:600;background:var(--blue);color:#fff;transition:opacity .15s,transform .1s}
.btn:active:not(:disabled){transform:scale(.985);opacity:.85}
.btn:disabled{opacity:.35}
.btn.gray{background:var(--card2);color:var(--text)}
.btn.tint{background:rgba(10,132,255,.15);color:var(--blue)}
.btn.red{background:var(--red)}
.btnrow{display:flex;gap:10px}
.sticky{position:sticky;bottom:0;padding:14px 0 calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,rgba(29,30,33,0));margin-top:-10px}
/* game */
.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.iconbtn{height:34px;padding:0 13px;border-radius:17px;background:var(--card2);font-size:14px;font-weight:600;color:var(--text)}
.standings{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 18px;padding:0 16px;scrollbar-width:none}
.standings::-webkit-scrollbar{display:none}
.st{flex:none;background:var(--card);border-radius:12px;padding:8px 13px;min-width:84px}
.st .n{font-size:12px;color:var(--sec);white-space:nowrap;max-width:110px;overflow:hidden;text-overflow:ellipsis}
.st .p{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.st.on{background:var(--text);color:#111}
.st.on .n{color:#555}
.deck{width:100%;border-radius:18px;padding:22px 18px;margin-bottom:16px;background:linear-gradient(150deg,#34363c,#26272b);border:1px solid rgba(255,255,255,.09);display:flex;align-items:center;gap:16px;text-align:left;box-shadow:0 10px 30px rgba(0,0,0,.25);position:relative;overflow:hidden}
.deck::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.06) 50%,transparent 70%);animation:shine 3s infinite}
@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.stack{width:46px;height:60px;position:relative;flex:none}
.stack i{position:absolute;inset:0;border-radius:8px;background:linear-gradient(150deg,#4a4c53,#3a3b41);border:1px solid rgba(255,255,255,.14)}
.stack i:nth-child(1){transform:rotate(-8deg) translate(-3px,1px)}
.stack i:nth-child(2){transform:rotate(4deg) translate(2px,0)}
.stack i:nth-child(3){background:linear-gradient(150deg,#0a84ff,#5e5ce6);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:#fff}
.deck .t{font-size:19px;font-weight:600}
.deck .s{font-size:14px;color:var(--sec);margin-top:3px}
.evcard{border-radius:18px;padding:16px;margin-bottom:16px;background:var(--card);display:flex;gap:14px;align-items:flex-start;border:1px solid rgba(255,255,255,.06)}
.evcard.flip{animation:flip .5s cubic-bezier(.2,.8,.2,1)}
@keyframes flip{from{transform:perspective(700px) rotateY(80deg);opacity:0}to{transform:none;opacity:1}}
.evcard .glyph{width:46px;height:46px;font-size:16px;border-radius:12px}
.evt{font-size:17px;font-weight:600}
.evx{font-size:14px;color:var(--sec);line-height:1.4;margin-top:2px}
.evnote{font-size:14px;color:var(--text);margin-top:8px;line-height:1.4}
.evcard .btn{height:40px;font-size:15px;margin-top:12px;border-radius:11px}
.locked{opacity:.35;pointer-events:none;filter:saturate(.6)}
.dicebox{background:var(--card);border-radius:18px;padding:18px 14px 14px;margin-bottom:22px}
.dice{display:flex;justify-content:center;gap:6px;margin-bottom:24px;--ds:min(46px,calc((100vw - 96px) / 6))}
.die{flex:none;width:var(--ds);height:var(--ds);border-radius:24%;background:linear-gradient(160deg,#ffffff,#e4e4ea);box-shadow:0 3px 8px rgba(0,0,0,.4),inset 0 -2px 0 rgba(0,0,0,.08);padding:0;position:relative;display:block;overflow:visible;transition:transform .15s,box-shadow .15s}
.die.blank{background:var(--card3);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.die.held{transform:translateY(-5px);box-shadow:0 0 0 2.5px var(--blue),0 8px 16px rgba(0,0,0,.4)}
.die.held::after{content:"Gehalten";position:absolute;left:-6px;right:-6px;bottom:-21px;font-size:10px;font-weight:600;color:var(--blue);text-align:center}
.die.jok{box-shadow:0 0 0 2.5px var(--purple),0 6px 14px rgba(0,0,0,.4)}
.die.roll{animation:roll .5s cubic-bezier(.2,.8,.2,1)}
@keyframes roll{0%{transform:rotate(-40deg) scale(.7);opacity:.4}60%{transform:rotate(8deg) scale(1.05)}100%{transform:none}}
.pips{position:absolute;inset:0;display:block}
.pips i{position:absolute;width:20%;height:20%;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 40% 35%,#3a3a3c,#111)}
.rollrow{display:flex;gap:10px}
.rollrow .btn{flex:1}
.rollrow .jk{flex:0 0 auto;width:auto;padding:0 18px;background:rgba(191,90,242,.18);color:#d18cf7}
.hint{font-size:13px;color:var(--sec);text-align:center;margin-top:10px;min-height:17px}
.row{display:flex;align-items:center;width:100%;min-height:54px;padding:9px 16px;gap:12px;text-align:left;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--sep)}
.row .grow{flex:1;min-width:0}
.rn{font-size:16px;font-weight:500}
.rh{font-size:12.5px;color:var(--sec);margin-top:1px}
.rv{display:flex;align-items:center;gap:7px;font-variant-numeric:tabular-nums}
.val{font-size:17px;font-weight:600}
.row.done .rn{color:var(--sec)}
.row.done .val{color:var(--text)}
.row.dim{opacity:.32}
.pv{font-size:16px;font-weight:600;color:var(--blue);background:rgba(10,132,255,.13);border-radius:8px;padding:3px 10px;min-width:40px;text-align:center}
.pv.zero{color:var(--ter);background:var(--card2)}
.chev{color:var(--ter);font-size:20px;font-weight:400}
.tag{font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px;background:rgba(255,159,10,.17);color:#ffb340}
.tag.neg{background:rgba(255,69,58,.17);color:#ff6961}
.sumrow{display:flex;justify-content:space-between;padding:12px 16px;font-size:15px;color:var(--sec);border-top:1px solid var(--sep)}
.sumrow b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.sumrow.ok b{color:var(--green)}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:#26272b;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.8,.2,1);max-height:92vh;overflow:auto;border-top:1px solid rgba(255,255,255,.06)}
@keyframes up{from{transform:translateY(60px);opacity:.5}}
.grab{width:36px;height:5px;border-radius:3px;background:#55565c;margin:0 auto 14px}
.sheet h2{font-size:22px;font-weight:700;margin:0 0 3px;letter-spacing:-.02em}
.sheet .muted{color:var(--sec);font-size:14px;margin:0 0 16px;line-height:1.4}
.calc{background:var(--card2);border-radius:14px;padding:14px 16px;margin-bottom:16px;font-size:15px;color:var(--sec)}
.calc .big{font-size:34px;font-weight:700;color:var(--text);letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.calc .note{margin-top:8px;color:#6bd8eb;font-size:13.5px}
.quick{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.quick button{background:var(--card2);font-size:15px;font-weight:600;padding:9px 14px;border-radius:10px}
.quick button.on{background:var(--blue)}
.field{background:var(--card2);border-radius:12px;padding:14px 16px;margin-bottom:8px}
.err{color:var(--red);font-size:13.5px;min-height:18px;margin-bottom:6px}
.pick{background:var(--card2);border-radius:14px;overflow:hidden;margin-bottom:16px;max-height:46vh;overflow-y:auto}
.pick .sub-h{background:var(--card2);position:sticky;top:0;z-index:1}
.pick .cell.sel{background:rgba(10,132,255,.16)}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid #5a5b61;flex:none}
.sel .radio{border:7px solid var(--blue)}
.reveal{text-align:center;padding:6px 0 4px}
.reveal .glyph{width:72px;height:72px;font-size:22px;border-radius:18px;margin:0 auto 14px;animation:flip .6s cubic-bezier(.2,.8,.2,1)}
.bigdie{position:relative;width:84px;height:84px;margin:6px auto 12px;border-radius:22%;background:linear-gradient(160deg,#fff,#e4e4ea);box-shadow:0 6px 18px rgba(0,0,0,.5)}
.bigdie.spin{animation:spin .25s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.coin{width:84px;height:84px;border-radius:50%;margin:6px auto 12px;background:radial-gradient(circle at 35% 30%,#ffe08a,#c9971c);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#5a3e00;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.coin.spin{animation:cflip .3s linear infinite}
@keyframes cflip{50%{transform:scaleX(.08)}}
.outcome{font-size:15px;color:var(--sec);margin:4px 0 18px;min-height:60px}
.outcome .big{font-size:34px;font-weight:700;color:var(--text);margin-top:4px}
.tblwrap{overflow-x:auto;border-radius:14px;background:var(--card2);margin-bottom:16px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--sep)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card2)}
thead th{color:var(--sec);font-weight:600;font-size:12.5px}
tr.sum td{color:var(--sec);background:#2d2e33}
tr.sum td:first-child{background:#2d2e33}
tr.tot td{font-weight:700;font-size:16px;color:var(--text)}
td small{color:#ffb340;font-size:10px;margin-left:3px}
.place{display:flex;align-items:center;gap:14px}
.rank{width:30px;height:30px;border-radius:50%;background:var(--card3);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.rank.r1{background:linear-gradient(150deg,#ffd76a,#d9a21b);color:#3d2c00}
.rank.r2{background:linear-gradient(150deg,#e8e8ed,#a9a9b0);color:#222}
.rank.r3{background:linear-gradient(150deg,#e3a578,#a8663a);color:#2b1608}
.pts{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:rgba(60,61,66,.96);backdrop-filter:blur(10px);color:#fff;padding:11px 18px;border-radius:14px;font-size:14.5px;font-weight:500;z-index:30;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.rules p,.rules li{font-size:14px;color:var(--sec);line-height:1.5;margin:0 0 8px}
.rules ul{padding-left:18px;margin:0}
.rules{padding:14px 16px}
.dicebox{--ds:min(46px,calc((100vw - 96px) / 6))}
.die.fix.held::after{content:"Fest"}
.tools{display:flex;gap:8px;margin-top:10px}
.tools button{flex:1;height:40px;border-radius:11px;font-size:15px;font-weight:600;background:rgba(191,90,242,.16);color:#d18cf7}
.tools button.on{background:var(--purple);color:#fff}
.banner{background:rgba(255,69,58,.12);color:#ff8a80;border-radius:14px;padding:11px 14px;font-size:14px;margin-bottom:12px}
.blk{font-size:12px;color:var(--red);font-weight:600}
.kbline{color:var(--green)!important}
.tag.prot{background:rgba(48,209,88,.16);color:#5be37f}
.g-pflicht{background:rgba(48,209,88,.15);color:#5be37f}
.chk{background:var(--card2);border-radius:12px;margin-bottom:8px}
.quick.nums{flex-wrap:nowrap}
.quick.nums button{flex:1;font-size:20px;padding:12px 0}
.backbtn{color:var(--blue);font-size:17px;margin:0 0 10px -2px}
.gitem{padding:0 0 0 16px;gap:0}
.gopen{text-align:left;padding:12px 0;min-width:0}
.trash{color:var(--red);font-size:14px;font-weight:600;padding:12px 16px;align-self:stretch}
.st.nm .p{font-size:16px}
.st{text-align:left}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px;vertical-align:middle}
.viewbar{display:flex;background:var(--card);border-radius:18px;padding:16px;margin-bottom:12px;border:1px solid rgba(255,255,255,.06)}
.mini{position:relative;width:34px;height:34px;border-radius:24%;background:linear-gradient(160deg,#fff,#e4e4ea);flex:none;box-shadow:0 2px 5px rgba(0,0,0,.35)}
.mini.blank{background:var(--card3);box-shadow:none}
.mini.spin{animation:spin .25s linear infinite}
.opendd{background:var(--card);border-radius:14px;margin:-4px 0 16px;overflow:hidden;border:1px solid rgba(255,255,255,.06)}
.ddbtn{display:flex;align-items:center;gap:10px;width:100%;padding:13px 16px;font-size:15.5px;font-weight:600;text-align:left}
.ddbtn span:first-child{flex:1}
.ddcount{background:var(--card3);border-radius:10px;padding:2px 9px;font-size:13px;color:var(--sec)}
.ddchev{color:var(--ter);font-size:16px}
.ddlist{border-top:1px solid var(--sep);max-height:52vh;overflow-y:auto}
.iconbtn.accent{background:var(--blue);color:#fff}
.dsheet{--ds:min(46px,calc((100vw - 92px) / 6));margin-bottom:16px}
.dsheet .die.cur{box-shadow:0 0 0 2px var(--blue)}
.quick.nums button[data-a=dpop]{background:var(--card3)}
.top{gap:10px}
.top>div:first-child{flex:1;min-width:0}
.top>div:last-child{flex:none}
.top .large{font-size:30px;overflow-wrap:anywhere}
.negv{color:#ff6961!important}
.pv.negv{background:rgba(255,69,58,.14)}
.quick.stakes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.quick.stakes button{font-size:20px;padding:14px 0}
.wheelbox{width:96px;height:96px;border-radius:50%;margin:6px auto 12px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:#fff;background:conic-gradient(#0a84ff 0 20%,#30d158 0 40%,#ff9f0a 0 60%,#bf5af2 0 80%,#ff375f 0);box-shadow:0 6px 18px rgba(0,0,0,.5);text-shadow:0 1px 4px rgba(0,0,0,.6)}
.wheelbox.spin{animation:spin .4s linear infinite}
.negv{color:#ff6961!important}
.pv.negv{background:rgba(255,69,58,.14)}
.quick.stakes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.quick.stakes button{font-size:20px;padding:14px 0}
.wheelbox{width:96px;height:96px;border-radius:50%;margin:6px auto 12px;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:#fff;background:conic-gradient(#0a84ff 0 20%,#30d158 0 40%,#ff9f0a 0 60%,#bf5af2 0 80%,#ff375f 0);box-shadow:0 6px 18px rgba(0,0,0,.5);text-shadow:0 1px 4px rgba(0,0,0,.6)}
.wheelbox.spin{animation:spin .4s linear infinite}
.reels{display:flex;gap:10px;justify-content:center;margin:6px 0 14px}
.reel{width:76px;height:84px;border-radius:14px;background:linear-gradient(180deg,#1a1b1e,#3b3d43 50%,#1a1b1e);border:2px solid #ffd76a;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:#ffd76a;box-shadow:0 6px 18px rgba(0,0,0,.5)}
.reel.spin{animation:reel .12s linear infinite}
@keyframes reel{0%{transform:translateY(-4px);filter:blur(2px)}50%{transform:translateY(4px);filter:blur(3px)}100%{transform:translateY(-4px);filter:blur(2px)}}
.reel{position:relative;overflow:hidden;display:block;padding:0}
.reel::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55),transparent 30%,transparent 70%,rgba(0,0,0,.55));pointer-events:none}
.strip{will-change:transform}
.strip>div{height:80px;display:flex;align-items:center;justify-content:center}
.reel.stopped{box-shadow:0 0 0 3px rgba(255,215,106,.35),0 6px 18px rgba(0,0,0,.5)}

const cnt=(d,v)=>d.filter(x=>x===v).length;
const sum=d=>d.reduce((a,b)=>a+b,0);
const counts=d=>[1,2,3,4,5,6].map(v=>cnt(d,v));

const nPairs=d=>counts(d).reduce((a,c)=>a+Math.floor(c/2),0);
const nTrips=d=>counts(d).reduce((a,c)=>a+Math.floor(c/3),0);

const run=d=>{const s=new Set(d);let best=0,cur=0;for(let v=1;v<=6;v++){if(s.has(v)){cur++;best=Math.max(best,cur)}else cur=0}return best};

 {id:'krain',g:'spezial',gl:'K+',title:'Kniffel-Regen',text:'Für jeden Kniffel, der in diesem Spiel schon gewürfelt wurde (alle Spieler zusammen), bekommst du sofort +50 Punkte, für jeden Kniffel Extreme +75.',now:'krain'},

const EV=Object.fromEntries(EVENTS.map(e=>[e.id,e]));
const PIP={1:[4],2:[2,6],3:[2,4,6],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const LSOLD='kniffel-extreme-v3',LSSEL='kniffel-extreme-sel-v3',LSG='kniffel-extreme-games-v1';

let S=null;
let setup={n:2,names:['Spieler 1','Spieler 2','Spieler 3','Spieler 4','Spieler 5','Spieler 6'],mode:'digital',rules:false,pfOpen:false,sel:loadSel()};
let ui={modal:null,flip:false,rolling:false,rollIdx:-1};
let view='home';

function loadSel(){try{const s=JSON.parse(localStorage.getItem(LSSEL));if(Array.isArray(s))return s.filter(id=>EV[id])}catch(e){}return EVENTS.map(e=>e.id)}
function saveSel(){try{localStorage.setItem(LSSEL,JSON.stringify(setup.sel))}catch(e){}}
/* ---------- Spielliste: Gerät + Claude-Konto ---------- */
function loadGames(){try{const o=JSON.parse(localStorage.getItem(LSG));if(o&&typeof o==='object')return o}catch(e){}return{}}
let GAMES=loadGames();
function persistLocal(){try{localStorage.setItem(LSG,JSON.stringify(GAMES))}catch(e){}}
const newId=()=>'g'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function save(){if(!S)return;S.updated=Date.now();S.rev=(S.rev||0)+1;const old=GAMES[S.id];GAMES[S.id]={id:S.id,updated:S.updated,finished:S.screen==='end',synced:!!(old&&old.synced),json:JSON.stringify(S)};persistLocal();queuePush(S.id);if(S.online)mpQueue()}
let RCOL=null,cloud='local',DB=null,DB_ALT=null,UID=null,MP=null;
const PQ={busy:{},dirty:{},tm:{}};
function queuePush(id){if(!RCOL)return;clearTimeout(PQ.tm[id]);PQ.tm[id]=setTimeout(()=>push(id),700)}
async function push(id){if(PQ.busy[id]){PQ.dirty[id]=true;return}const g=GAMES[id];if(!g||!RCOL)return;PQ.busy[id]=true;
 try{await RCOL.doc(id).set({kind:'kx-game',updated:g.updated,finished:g.finished,json:g.json});if(GAMES[id]){GAMES[id].synced=true;persistLocal()}}catch(e){}
 PQ.busy[id]=false;if(PQ.dirty[id]){PQ.dirty[id]=false;push(id)}}
async function remoteDelete(id){if(!RCOL)return;try{await RCOL.doc(id).delete()}catch(e){}}
/* ---------- Firebase (Online-Modus) ---------- */
function deviceId(){try{let id=localStorage.getItem('kx-device');if(!id){id='d'+Date.now().toString(36)+Math.random().toString(36).slice(2,10);localStorage.setItem('kx-device',id)}return id}catch(e){return 'd'+Math.random().toString(36).slice(2,12)}}
async function initCloud(){try{
 if(!window.FIREBASE_CONFIG||typeof firebase==='undefined')return;
 firebase.initializeApp(window.FIREBASE_CONFIG);UID=deviceId();
 if(window.FIREBASE_CONFIG.databaseURL&&firebase.database){
  // Realtime Database: schnelle Synchronisation über WebSocket
  const rdb=firebase.database();
  const flat=(o,pre,out)=>{for(const k in o){const v=o[k],key=pre?pre+'/'+k:k;if(v&&typeof v==='object'&&!Array.isArray(v))flat(v,key,out);else out[key]=v===undefined?null:v}return out};
  DB={doc:p=>{const r=rdb.ref(p);return{
   get:async()=>{const sn=await r.get();return{exists:sn.exists(),id:p.split('/').pop(),data:()=>sn.val(),metadata:{fromCache:false}}},
   set:d=>r.set(d),update:d=>r.update(flat(d,'',{})),delete:()=>r.remove(),
   onSnapshot:(n,e)=>{const cb=sn=>n({exists:sn.exists(),id:p.split('/').pop(),data:()=>sn.val(),metadata:{fromCache:false}});r.on('value',cb,err=>e&&e(err));return()=>r.off('value',cb)}}}};
 }
 const fs=firebase.firestore();
 const wrap=s=>({exists:s.exists,id:s.id,data:()=>s.data(),metadata:s.metadata});
 const FSDB={doc:p=>{const r=fs.doc(p);return{get:async()=>wrap(await r.get()),set:d=>r.set(d),update:d=>r.set(d,{merge:true}),delete:()=>r.delete(),onSnapshot:(n,e)=>r.onSnapshot(s=>n(wrap(s)),e)}}};
 if(DB)DB_ALT=FSDB;else DB=FSDB;
}catch(e){console.warn(e)}}

const fmtN=v=>v<0?'−'+Math.abs(v):String(v);

function freshTurn(){return{drawn:!activeIds().length,ev:null,note:'',pending:null,lock:null,blocked:null,dice:[1,1,1,1,1,1],held:[false,false,false,false,false,false],fixed:-1,startPick:false,rolls:0,max:3,jokerN:0,jokerDice:[],jokerUsed:false,tool:null,mirUsed:false,rerollUsed:false,retryUsed:false}}
function newGame(names,mode,events){S={id:newId(),created:Date.now(),screen:'game',mode,events,players:names.map(n=>({name:n,sc:{},bt:BONUS_T,bf:1,ua:0,kb:0,adj:0,half:false,got:[],pf:0})),cur:0};S.turn=freshTurn();save();render()}
const evOf=t=>t&&t.ev?EV[t.ev]:null;
const dOf=t=>t.dice;
const openCats=p=>CATS.filter(c=>!p.sc[c.id]);

function totals(p){let upF=0,lo=0;for(const c of CATS){const e=p.sc[c.id];if(!e)continue;if(c.sec==='oben')upF+=e.final;else lo+=e.final}
 const upAcc=upF+(p.ua||0);const bonus=upAcc>=p.bt?BONUS_P*p.bf:0;const upper=upAcc+bonus;
 return{upF,upAcc,bonus,upper,lo,total:upper+lo+(p.kb||0)+(p.adj||0)}}

function allowed(p,t,c){if(p.sc[c.id])return false;if(t.lock)return c.id===t.lock;if(t.bet)return t.bet.cats.includes(c.id);if(isBlocked(t,c.id))return false;return true}
function isBlocked(t,id){return Array.isArray(t.blocked)?t.blocked.includes(id):t.blocked===id}

/* Wertung vor verdeckten Effekten */
function baseFinal(p,t,raw,rolls,id){const ev=evOf(t),parts=[],c=id?CAT[id]:null,onBet=!!(t.bet&&id&&t.bet.cats.includes(id));
 if(!raw||raw<=0){if(onBet)return{f:-t.bet.stake,parts:['Wette −'+t.bet.stake]};return{f:0,parts}}let f=raw;
 if(ev&&ev.mult){f=Math.floor(f*ev.mult);parts.push(ev.mult===.5?'½':'×'+ev.mult)}
 if(ev&&ev.fixedMult&&c&&c.fixed){f*=ev.fixedMult;parts.push('×'+ev.fixedMult)}
 if(p.half){f=Math.floor(f/2);parts.push('½')}
 if(ev&&ev.cost&&rolls>1){const k=ev.cost*(rolls-1);f=Math.max(0,f-k);parts.push('−'+k)}
 if(ev&&ev.hattrick&&['hw','kn','ke'].includes(id)){f+=100;parts.push('+100')}
 if(onBet){f+=t.bet.stake;parts.push('Wette +'+t.bet.stake)}
 return{f,parts}}
function kniffelEligible(p,id){return id!=='kn'&&p.sc.kn&&p.sc.kn.raw===50}
function keEligible(p,id){return id!=='ke'&&p.sc.ke&&p.sc.ke.raw===75}
function kniffelBonus(p,id,raw,ctx){const kOk=kniffelEligible(p,id),keOk=keEligible(p,id);if(!kOk&&!keOk)return 0;const c=CAT[id];let five=false,six=false;
 if(S.mode==='digital'||ctx.dice){const mc=maxC(S.turn.dice);five=mc>=5;six=mc>=6}
 else if(c.face){five=raw>0&&raw>=c.face*5;six=raw>0&&raw===c.face*6}
 else if(id==='ke'){five=raw===75}
 else{six=!!ctx.ke;five=six||!!ctx.kb}
 if(keOk&&six)return 75;if(kOk&&five)return 50;return 0}
const kbLabel=a=>a===75?'Kniffel-Extreme-Bonus +75':'Kniffel-Bonus +50';

/* ---------- Ziehen: jede Karte je Spieler max. 1×, Pflichtwurf max. 3× ---------- */
const PF_MAX=3;
function shuffle3(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,3)}
const betCats=p=>openCats(p).filter(c=>c.sec==='unten'&&c.id!=='ch'&&c.id!=='sc');
function applicable(e,p){const oc=openCats(p).length,done=CATS.length-oc;if(e.lateOnly&&oc>e.lateOnly)return false;if(e.fromRound&&done+1<e.fromRound)return false;if(e.block&&oc<4)return false;if(e.pick==='bet'&&betCats(p).length<3)return false;if(e.multi&&solo())return false;if(e.lock&&p.sc[e.lock])return false;
 if((e.block||e.pick==='force'||e.pick==='oppforce'||e.after==='mix')&&openCats(p).length<2)return false;return true}
const CARD_W={bet:3,retry:4.5,shield:2,b100x2:2,swap:2,sacrifice:2,block:1.15};
function wpick(c){const tw=c.reduce((a,id)=>a+(CARD_W[id]||1),0);let r=Math.random()*tw;for(const id of c){r-=CARD_W[id]||1;if(r<=0)return id}return c[c.length-1]}
function drawCard(p){p.got=p.got||[];p.pf=p.pf||0;
 const avail=activeIds().filter(id=>!p.got.includes(id)&&applicable(EV[id],p));
 const pf=avail.filter(id=>EV[id].g==='pflicht'),other=avail.filter(id=>EV[id].g!=='pflicht');
 const cands=other.slice();if(pf.length&&p.pf<PF_MAX)cands.push('__pf');
 if(!cands.length){
  // Zu wenige aktive Karten: Einmal-Regel aufheben, Karten dürfen erneut kommen
  const all=activeIds().filter(id=>applicable(EV[id],p));if(!all.length)return null;
  const apf=all.filter(id=>EV[id].g==='pflicht'),aot=all.filter(id=>EV[id].g!=='pflicht');
  let c2=aot.filter(id=>id!==p.lastRep);if(!c2.length)c2=aot.slice();if(apf.length)c2.push('__pf');
  let id=wpick(c2);if(id==='__pf'){id=rnd(apf.filter(x=>x!==p.lastRep).length?apf.filter(x=>x!==p.lastRep):apf);p.pf++}
  p.lastRep=id;p.got.push(id);return id}
 let id=wpick(cands);if(id==='__pf'){id=rnd(pf);p.pf++}
 p.lastRep=id;p.got.push(id);return id}

function pickOptions(kind){const me=S.players[S.cur],t=S.turn,out=[];
 if(kind==='strike')S.players.forEach((q,qi)=>{if(qi===S.cur)return;CATS.forEach(c=>{const e=q.sc[c.id];if(e&&e.final>0&&!e.prot)out.push({key:qi+'|'+c.id,group:q.name,label:c.name,val:e.final})})});
 if(kind==='replay')CATS.forEach(c=>{const e=me.sc[c.id];if(e&&e.final===0)out.push({key:'x|'+c.id,group:'Deine gestrichenen Kategorien',label:c.name})});
 if(kind==='swap')S.players.forEach((q,qi)=>{if(qi===S.cur)return;CATS.forEach(c=>{const a=me.sc[c.id],b=q.sc[c.id];if(a&&b&&a.final!==b.final)out.push({key:qi+'|'+c.id,group:'Tauschen mit '+q.name,label:c.name,sub:'Du '+a.final+'  ⇄  '+q.name+' '+b.final,diff:b.final-a.final})})});
 if(kind==='gift50'||kind==='giftua')S.players.forEach((q,qi)=>{if(qi!==S.cur)out.push({key:qi+'|x',group:'Mitspieler',label:q.name})});
 if(kind==='force'||kind==='oppforce')CATS.forEach(c=>{if(!me.sc[c.id]&&!isBlocked(t,c.id))out.push({key:'x|'+c.id,group:c.sec==='oben'?'Oberer Teil':'Unterer Teil',label:c.name,sub:c.hint})});
 if(kind==='heal')CATS.forEach(c=>{const e=me.sc[c.id];if(e&&e.final===0)out.push({key:'x|'+c.id,group:'Deine gestrichenen Kategorien',label:c.name})});
 if(kind==='sac2')return pickOptions('strike');
 if(kind==='sac1'||kind==='selfstrike'){CATS.forEach(c=>{const e=me.sc[c.id];if(e&&e.final>0)out.push({key:'x|'+c.id,group:'Eingetragen – wird auf 0 gesetzt',label:c.name,val:e.final})});const op=openCats(me);if(op.length>1)op.forEach(c=>out.push({key:'x|'+c.id,group:'Noch offen – wird mit 0 gestrichen',label:c.name}))}
 if(kind==='shield')CATS.forEach(c=>{const e=me.sc[c.id];if(e&&!e.prot)out.push({key:'x|'+c.id,group:'Deine Wertungen',label:c.name,val:e.final})});
 return out}
const PICK={

 gift50:{h:'Wer bekommt 50 Punkte geschenkt?',b:'50 Punkte schenken'},

 sac1:{h:'Zuerst streichst du bei dir selbst eine Kategorie. Danach darfst du bei einem Gegner 2 Wertungen streichen.',b:'Bei mir streichen',red:true,fz:'Kein Gegner hat ungeschützte Punkte – die Karte verfällt.'},
 sac2:{h:'Wähle bis zu 2 Wertungen eines Gegners, die gestrichen werden.',b:'Streichen',red:true},
 selfstrike:{h:'Ungerade Zahl – streiche eine Kategorie bei dir selbst.',b:'Bei mir streichen',red:true},

function kniffelCount(){if(S.kc!=null||S.kec!=null)return{k:S.kc||0,e:S.kec||0};let k=0,e=0;S.players.forEach(q=>{if(q.sc.kn&&q.sc.kn.raw===50)k++;if(q.sc.ke&&q.sc.ke.raw===75)e++});return{k,e}}
function drawEvent(){const t=S.turn,p=S.players[S.cur];const id=drawCard(p);
 if(!id){t.drawn=true;t.none=true;save();render();return}
 const ev=EV[id];t.ev=id;t.drawn=true;t.max=ev.rolls||3;t.jokerN=ev.joker||0;t.note='';
 const rest='Gilt ab sofort für den Rest des Spiels. Jetzt normal würfeln.';
 if(ev.bt){p.bt=ev.bt;t.note=rest}
 if(ev.bf!==undefined){p.bf=ev.bf;t.note=rest}
 if(ev.ua){p.ua=(p.ua||0)+ev.ua;t.note='Dein Konto im oberen Teil steht jetzt bei '+(p.ua>0?'+':'')+p.ua+'. Jetzt normal würfeln.'}
 if(ev.lock)t.lock=ev.lock;
 if(ev.pick==='oppforce'||ev.fremd){t.decider=rnd(S.players.map((_,i)=>i).filter(i=>i!==S.cur));const dn=esc(S.players[t.decider].name);t.note=S.online?(ev.fremd?dn+' bestimmt nach dem ersten Wurf, welche Würfel '+esc(p.name)+' hält.':dn+' entscheidet, in welcher Kategorie '+esc(p.name)+' wertet.'):(ev.fremd?dn+' bestimmt nach deinem ersten Wurf, welche Würfel du hältst.':dn+' entscheidet, in welcher Kategorie du wertest.')}
 if(ev.block){const pool=shuffle3(openCats(p));t.blocked=pool.map(c=>c.id);t.note='Gesperrt: '+pool.map(c=>'„'+c.name+'“').join(', ')+'.'}
 if(ev.start&&S.mode==='digital')t.startPick=true;
 if(ev.now==='tax'){S.players.forEach(q=>{if(q===p)return;const l=totals(q).lo;q.adj=(q.adj||0)-Math.floor(Math.max(0,l)*0.1)});t.note='Alle Mitspieler verlieren 10 % ihrer Punkte im unteren Teil. Jetzt normal würfeln.'}
 else if(ev.now==='dblup'){CATS.filter(c=>c.sec==='oben').forEach(c=>{const e=p.sc[c.id];if(e&&e.final){e.final*=2;addTag(e,'×2')}});p.ua=(p.ua||0)*2;t.note='Deine bonusrelevanten Punkte wurden verdoppelt: Bonus-Konto jetzt '+fmtN(totals(p).upAcc)+' / 100. Dein Wurf zählt diesen Zug ×4.'}
 else if(ev.now==='peek'){p.peekUntil=(CATS.length-openCats(p).length)+3;t.note='Du siehst jetzt 3 Runden lang die Gesamtpunkte aller Spieler. Dein Wurf zählt diesen Zug ×3.'}
 else if(ev.now==='krain'){const n=kniffelCount();const g=n.k*50+n.e*75;p.adj=(p.adj||0)+g;t.note=(n.k||n.e)?'Bisher gewürfelt: '+n.k+'× Kniffel und '+n.e+'× Kniffel Extreme – du bekommst +'+g+' Punkte. Jetzt normal würfeln.':'Bisher wurde noch kein Kniffel gewürfelt – leider 0 Punkte. Normal weiterspielen.'}
 else if(ev.now==='crown'){const best=CATS.map(c=>({c,e:p.sc[c.id]})).filter(x=>x.e&&x.e.final>0).sort((a,b)=>b.e.final-a.e.final)[0];if(!best)t.note='Du hast noch keine Punkte – die Karte verfällt. Normal weiterspielen.';else{const o=best.e.final;best.e.final=o*3;addTag(best.e,'×3');t.note='Krönung: „'+best.c.name+'“ '+o+' → '+best.e.final+'. Jetzt normal würfeln.'}}
 else if(ev.now){const best=CATS.map(c=>p.sc[c.id]).filter(e=>e&&e.final>0).sort((a,b)=>b.final-a.final)[0];const bc=best&&CATS.find(c=>p.sc[c.id]===best);
  if(!best)t.note='Du hast noch keine Punkte – die Karte verfällt. Normal weiterspielen.';
  else if(ev.now==='backlash'){const o=best.final;best.final=Math.max(0,o-30);addTag(best,'−30');t.note='„'+bc.name+'“: '+o+' → '+best.final+'. Jetzt normal würfeln.'}
  else{const o=best.final;best.final=Math.floor(o/2);addTag(best,'½');t.note='„'+bc.name+'“: '+o+' → '+best.final+'. Jetzt normal würfeln.'}}
 if(ev.pick){if(ev.pick==='gamble'||ev.pick==='duel'||ev.pick==='bet'||ev.pick==='rcount')t.pending=ev.pick;else if(ev.pick==='sac1'){if(pickOptions('sac2').length&&pickOptions('sac1').length)t.pending='sac1';else t.note=PICK.sac1.fz+' Normal weiterspielen.'}else if(pickOptions(ev.pick).length)t.pending=ev.pick;else t.note=PICK[ev.pick].fz+' Normal weiterspielen.'}
 ui.flip=true;setTimeout(()=>ui.flip=false,600);save();render();
 if(t.pending)setTimeout(()=>{if(S&&S.turn===t&&t.pending&&!ui.modal&&canAct()){openPending()}},550)}

function duelEval(m){const t=S.turn,mx=Math.max(...m.cont.map(i=>m.vals[i]));const top=m.cont.filter(i=>m.vals[i]===mx);m.last=Object.assign({},m.last,m.vals);
 if(top.length===1){m.winner=top[0];m.phase='done';S.players.forEach((q,i)=>{q.ua=(q.ua||0)+(i===m.winner?30:-10)});t.pending=null;t.note=esc(S.players[m.winner].name)+' gewinnt das Duell (+30 aufs Bonus-Konto), alle anderen −10. Jetzt normal würfeln.';save()}

 if(d%2===0){if(pickOptions('strike').length){t.pending='strike';t.note='Gewürfelt: '+d+' (gerade) – streiche eine Wertung bei einem Gegner.'}else{t.pending=null;t.note='Gewürfelt: '+d+' (gerade) – aber kein Gegner hat ungeschützte Punkte. Normal weiterspielen.'}}

 if(kind==='sac2'){const names=[];for(const k of key){const [qi,cid]=k.split('|');const q=S.players[+qi];names.push(CAT[cid].name+' ('+q.sc[cid].final+')');q.sc[cid]={raw:0,final:0,tag:'✕'}}const q=S.players[+key[0].split('|')[0]];t.note='Bei '+esc(q.name)+' gestrichen: '+names.join(', ')+'. Jetzt normal würfeln.';t.pending=null;ui.modal=null;renderModal();save();render();return}

 if(kind==='force'||kind==='oppforce'){t.lock=cid;t.note=(kind==='oppforce'&&t.decider!=null?esc(S.players[t.decider].name)+' hat entschieden: ':'')+'Diese Runde wertest du in „'+c.name+'“.'+(kind==='oppforce'?' Schaffst du sie, zählt sie ×3.':'')}
 if(kind==='gift50'){const q=S.players[+a];q.adj=(q.adj||0)+50;t.note=esc(q.name)+' bekommt 50 Punkte. Dein Wurf zählt diese Runde ×2 – jetzt würfeln.'}
 if(kind==='giftua'){const q=S.players[+a];q.ua=(q.ua||0)+15;t.note=esc(q.name)+' bekommt 15 Punkte aufs Bonus-Konto. Dein Wurf zählt diese Runde ×4 – jetzt würfeln.'}
 if(kind==='heal'){me.sc[cid]={raw:40,final:40,tag:'+40',prot:me.sc[cid].prot};t.note='„'+c.name+'“ bekommt 40 Punkte. Jetzt normal würfeln.'}
 if(kind==='selfstrike'||kind==='sac1'){const old=me.sc[cid];me.sc[cid]={raw:0,final:0,tag:'✕'};t.note='Bei dir gestrichen: „'+c.name+'“'+(old?' ('+old.final+')':'')+'.'+(kind==='selfstrike'?' Jetzt normal würfeln.':'')}
 if(kind==='sac1'){t.pending='sac2';save();render();openPending();return}

function spinSlots(m){if(m.spinning)return;m.spinning=true;const btn=document.getElementById('spinbtn');if(btn){btn.disabled=true;btn.textContent='Die Walzen drehen sich …'}
 const reels=[0,1,2].map(()=>rnd(SLOT_SYM));let v=m.amount;const steps=['Start: '+v];
 reels.forEach((res,i)=>{const strip=document.getElementById('strip'+i),win=document.getElementById('reel'+i);if(!strip||!win)return;const H=win.clientHeight;const n=26+i*10;let html='<div>'+strip.textContent+'</div>';for(let k=1;k<n;k++)html+='<div>'+SLOT_SYM[(k+i)%3]+'</div>';html+='<div>'+res+'</div>';strip.style.transition='none';strip.style.transform='translateY(0)';strip.innerHTML=html;void strip.offsetHeight;
  const dur=1.6+i*0.9;requestAnimationFrame(()=>{strip.style.transition='transform '+dur+'s cubic-bezier(.15,.7,.2,1)';strip.style.transform='translateY(-'+(n*H)+'px)'});
  setTimeout(()=>{if(ui.modal!==m)return;win.classList.add('stopped');v=res==='+25'?v+25:v*(res==='×2'?2:3);steps.push(res+' = '+v);const el=document.getElementById('slotcalc');if(el)el.textContent=steps.join(' → ')},dur*1000+60)});
 setTimeout(()=>{if(ui.modal!==m)return;m.ctx.reels=reels;commit(m.id,m.raw,m.ctx)},(1.6+2*0.9)*1000+1100)}
function applyAfter(entry,kind,cid,ctx,p){const c=CAT[cid],dig=S.mode==='digital',t=S.turn;const res={before:entry.final,text:''};
 const others=S.players.filter(q=>q!==p);
 switch(kind){
  case'umsonst':entry.raw=0;entry.final=0;entry.tag='✕';res.text='Die Kategorie wird gestrichen.';break;
  case'fate':{const d=ctx.fdie||r6();res.die=d;if(d===1){entry.raw=0;entry.final=0;entry.tag='✕';res.text='Eine 1 – die Wertung wird gestrichen.'}else{const m=d<=3?1:d<=5?5:10;entry.final*=m;if(m>1&&entry.final)addTag(entry,'×'+m);res.text='Eine '+d+' – Wertung '+(m===1?'bleibt unverändert':'× '+m)+'.'}break}
  case'jackpot':if(entry.final>=40){entry.final*=2;addTag(entry,'×2');res.text='Jackpot! Deine Wertung zählt doppelt.'}else res.text='Unter 40 Punkten – kein Jackpot.';break;
  case'trost':if(entry.final===0){entry.final=20;entry.tag='+20';res.text='Trostpreis: 20 Punkte.'}else res.text='Du hast nicht gestrichen – die Wertung bleibt.';break;
  case'spiegel':if(entry.final===0){const nv=c.fixed||(c.face?c.face*3:20);entry.final=nv;entry.tag='⇆';res.text='Gespiegelt – du bekommst '+nv+' Punkte geschenkt.'}else res.text='Du hattest Punkte – die Wertung bleibt.';break;
  case'up10':if(entry.final>0){entry.final=(Math.floor(entry.final/10)+1)*10;res.text='Aufgerundet auf den nächsten Zehner.'}else res.text='Bei 0 gibt es nichts aufzurunden.';break;
  case'down10':entry.final=Math.floor(entry.final/10)*10;res.text='Abgerundet auf den nächsten Zehner.';break;
  case'ones':{const n=(dig||ctx.dice)?cnt(t.dice,1):ctx.n;for(let i=0;i<n;i++)entry.final=Math.floor(entry.final/2);if(n&&entry.raw)addTag(entry,'½'.repeat(Math.min(n,3))+(n>3?'…':''));res.text=n?n+'× die 1 – Wertung '+n+'× halbiert.':'Keine 1 – Glück gehabt!';break}
  case'sixes':{const n=(dig||ctx.dice)?cnt(t.dice,6):ctx.n;const m=Math.pow(2,n);entry.final*=m;if(n&&entry.final)addTag(entry,'×'+m);res.text=n?n+'× die 6 – Wertung × '+m+'.':'Keine 6 – die Wertung bleibt.';break}
  case'pionier':{const first=entry.raw>0&&!others.some(q=>q.sc[cid]&&q.sc[cid].final>0);p.adj+=first?20:-20;res.text=first?'Du bist der Erste – +20 Punkte!':'Nicht der Erste – −20 Punkte.';break}
  case'thief':{const am=Math.max(0,entry.final);if(am>0&&ctx.target!=null){const q=S.players[ctx.target];q.adj-=am;res.text=esc(q.name)+' verliert '+am+' Punkte.'}else res.text='Nichts zu stehlen.';break}
  case'gift':{const rcv=others.slice().sort((a,b)=>totals(a).total-totals(b).total)[0];const g=Math.max(0,entry.final);rcv.adj+=g;entry.final=0;if(g)entry.tag='→';res.text=g?esc(rcv.name)+' bekommt deine '+g+' Punkte.':'Es gab nichts zu verschenken.';break}
  case'share':{let given=0;for(const q of others){const g=Math.max(0,Math.min(5,entry.final));entry.final-=g;q.adj+=g;given+=g}if(given)addTag(entry,'−'+given);res.text=given?'Deine Mitspieler bekommen zusammen '+given+' Punkte.':'Es gab nichts zu teilen.';break}
  case'mix':res.text=ctx.mixId?'Deine Wertung landet in „'+CAT[ctx.mixId].name+'“.':'Keine andere Kategorie frei – die Wertung bleibt.';break;
  case'wheel':{const opts=[10,25,50,100,'x2'],o=rnd(opts);res.wheel=o;if(o==='x2'){entry.final*=2;if(entry.final)addTag(entry,'×2');res.text='Das Rad zeigt ×2 – deine Wertung zählt doppelt.'}else{entry.final+=o;addTag(entry,'+'+o);res.text='Das Rad zeigt +'+o+' Punkte!'}break}
  case'slots':{const reels=ctx.reels||[0,1,2].map(()=>rnd(SLOT_SYM));let v=entry.final;const steps=[String(v)];for(const r of reels){v=r==='+25'?v+25:v*(r==='×2'?2:3);steps.push(r+' = '+v)}entry.final=v;addTag(entry,'777');res.reels=reels;res.text=steps.join(' → ')+(reels.every(r=>r==='×3')?' – MAXIMALER JACKPOT!':'');break}
  case'nexthalf':p.half=true;res.text='Deine nächste Wertung zählt nur die Hälfte.';break;
 }
 res.after=entry.final;return res}

function catTap(id){const t=S.turn,p=S.players[S.cur],c=CAT[id];if(p.sc[id])return;
 if(!t.drawn){toast('Zieh zuerst deine Ereigniskarte');return}
 if(t.pending){openPending();return}
 if(!allowed(p,t,c)){toast(t.lock?'Diese Runde nur „'+CAT[t.lock].name+'“':'„'+c.name+'“ ist diese Runde gesperrt');return}
 if(S.mode==='digital'){if(t.startPick){toast('Wähle zuerst deinen Startwürfel');return}if(t.rolls===0){toast('Erst würfeln');return}if(t.tool){toast('Beende zuerst die Würfel-Aktion');return}ui.modal={type:'confirm',id,raw:c.calc(dOf(t))}}
 else ui.modal={type:'input',id,val:'',rolls:t.max,kb:false};
 renderModal()}

function nextIndex(){const n=S.players.length;for(let k=1;k<=n;k++){const i=(S.cur+k)%n;if(openCats(S.players[i]).length)return i}return -1}

function commit(id,raw,ctx){ctx=ctx||{};const t=S.turn,p=S.players[S.cur],ev=evOf(t),dig=S.mode==='digital';const after=ev&&ev.after;
 if(after==='mix'&&ctx.mixId===undefined){const o=CATS.filter(c=>c.id!==id&&!p.sc[c.id]&&!isBlocked(t,c.id));ctx.mixId=o.length?rnd(o).id:null}
 let need=null;
 if(!dig){if(after==='fate'&&ctx.fdie==null)need='fate';else if((after==='ones'||after==='sixes')&&ctx.n==null&&!ctx.dice)need=after;else if(after==='mix'&&ctx.mixId&&ctx.mixVal==null&&!ctx.dice)need='mix'}
 const rolls=dig?t.rolls:(ctx.rolls||1);
 const target=after==='mix'&&ctx.mixId?ctx.mixId:id;
 const r=target===id?raw:((dig||ctx.dice)?CAT[target].calc(dOf(t)):(ctx.mixVal||0));
 const b=baseFinal(p,t,r,rolls,target);
 if(!need&&after==='slots'&&!ctx.reels)need='slots';
 if(!need&&after==='thief'&&ctx.target==null&&b.f>0)need='thief';
 if(need){ui.modal={type:'need',need,id,raw,ctx,val:'',amount:b.f};renderModal();return}
 const entry={raw:r,final:b.f,tag:b.parts.join(' ')};
 p.half=false;
 {const c0=CAT[id];let six,five;if(dig||ctx.dice){const mc=maxC(t.dice);six=mc>=6;five=mc>=5}else{six=(id==='ke'&&raw===75)||(c0.face&&raw===c0.face*6)||!!ctx.ke;five=six||(id==='kn'&&raw===50)||(c0.face&&raw>=c0.face*5)||!!ctx.kb}if(five){const n=kniffelCount();S.kc=n.k+(six?0:1);S.kec=n.e+(six?1:0)}}
 const kb=kniffelBonus(p,id,raw,ctx);if(kb){p.kb=(p.kb||0)+kb;entry.kbon=kb}
 let res=null;if(after)res=applyAfter(entry,after,target,ctx,p);
 p.sc[target]=entry;
 ui.viewP=null;S.last={who:p.name,cat:CAT[target].name,val:entry.final,ev:ev?ev.title:null};S.log=(S.log||[]).concat([{who:p.name,cat:CAT[target].name,val:entry.final,ev:ev?ev.title:null,kb:kb||0,res:res?res.text:null,bet:t.bet?t.bet.stake:null}]).slice(-10);if(res){S.rseq=(S.rseq||0)+1;S.lastReveal={seq:S.rseq,ev:ev.id,cat:target,res,kb,who:p.name,uid:p.uid||null}}
 const reveal=after?{type:'reveal',ev:ev.id,cat:target,res,kb,phase:((after==='fate'&&!ctx.fdie)||after==='wheel')?'spin':'done',who:p.name}:null;
 const ni=nextIndex();if(ni<0){S.screen='end'}else{S.cur=ni;S.turn=freshTurn()}save();

 if(reveal){if(S.lastReveal)ui.seenReveal=S.lastReveal.seq;reveal.next=S.screen==='end'?null:S.players[S.cur].name;ui.modal=reveal;renderModal();if(reveal.phase==='spin')setTimeout(()=>{if(ui.modal===reveal){reveal.phase='done';renderModal()}},1300)}
 else{ui.modal=null;renderModal();if(kb)toast(kbLabel(kb)+' für '+p.name)}}

function validate(c,v){if(v===''||isNaN(v))return'Bitte eine Zahl eingeben.';v=+v;if(v<0||!Number.isInteger(v))return'Nur ganze Zahlen ab 0.';if(v===0)return'';

 if(c.range&&(v<c.range[0]||v>c.range[1]))return'Erlaubt: 0 oder '+c.range[0]+'–'+c.range[1]+'.';if(c.even&&v%2)return'Super Chance ergibt immer eine gerade Zahl.';return''}

function canPeek(){const v=peekViewer();if(!v||!v.peekUntil)return false;return (CATS.length-openCats(v).length)<v.peekUntil}

 if(t.pending==='oppforce')return me(t.decider);

function mpSubscribe(code){mpLeave();const ref=DB.doc('mp/'+code);const m={code,ref,busy:false,dirty:false,tm:null,lobby:null,warned:false};MP=m;
 m.unsub=ref.onSnapshot(snap=>{if(MP!==m)return;
  if(!snap.exists){m.lobby=null;if(!S&&view==='lobby'&&!snap.metadata.fromCache){toast('Dieses Spiel gibt es nicht mehr');view='home';mpLeave();render()}return}
  const d=snap.data();m.lobby=d;
  if(d.status==='lobby'){if(!S){view='lobby';render()}return}
  if(typeof d.json!=='string')return;let r;try{r=JSON.parse(d.json)}catch(e){return}
  if(ui.seenReveal==null||!S||S.id!==r.id)ui.seenReveal=(r.lastReveal&&(!S||S.id!==r.id))?r.lastReveal.seq:(ui.seenReveal||0);
  const showRev=r.lastReveal&&r.lastReveal.seq>(ui.seenReveal||0)&&r.lastReveal.uid!==UID;
  if(!S||S.id!==r.id||(r.rev||0)>(S.rev||0)){S=r;view='game';const old=GAMES[S.id];GAMES[S.id]={id:S.id,updated:Date.now(),finished:S.screen==='end',synced:!!(old&&old.synced),json:d.json};persistLocal();queuePush(S.id);
   if(ui.modal&&!['reveal','board','info','menu','del'].includes(ui.modal.type)&&!canAct()){ui.modal=null;renderModal()}
   render();if(showRev){ui.seenReveal=r.lastReveal.seq;const L=r.lastReveal;ui.modal={type:'reveal',ev:L.ev,cat:L.cat,res:L.res,kb:L.kb,phase:'done',who:L.who,next:null,watch:true};renderModal()}
   const t=S.turn;if(S.screen==='game'&&t&&t.pending&&canAct()&&!ui.modal)openPending()}
 },e=>toast('Verbindung zum Online-Spiel unterbrochen'))}

  case'mode':setup.mode=b.dataset.m;render();break;
  case'rules':setup.rules=!setup.rules;render();break;
  case'tog':{const id=b.dataset.id,i=setup.sel.indexOf(id);if(i<0)setup.sel.push(id);else setup.sel.splice(i,1);saveSel();render();break}
  case'pfall':{const ids=EVENTS.filter(e=>e.g==='pflicht').map(e=>e.id);const all=ids.every(id=>setup.sel.includes(id));setup.sel=setup.sel.filter(id=>!ids.includes(id));if(!all)setup.sel.push(...ids);saveSel();render();break}
  case'pfopen':setup.pfOpen=!setup.pfOpen;render();break;
  case'selall':setup.sel=EVENTS.map(e=>e.id);saveSel();render();break;
  case'selnone':setup.sel=[];saveSel();render();break;
  case'start':newGame(setup.names.slice(0,setup.n).map((n,i)=>n.trim()||'Spieler '+(i+1)),setup.mode,setup.sel.slice());window.scrollTo(0,0);break;
  case'new':setup.online=false;view='setup';render();window.scrollTo(0,0);break;
  case'open':{const g=GAMES[b.dataset.id];if(!g)return;try{S=JSON.parse(g.json)}catch(e){toast('Spiel konnte nicht geladen werden');return}ui.viewP=null;ui.seenReveal=S.lastReveal?S.lastReveal.seq:0;if(S.online){if(DB&&UID)mpSubscribe(S.online.code);else toast('Offline – du siehst den letzten Stand');}ui.modal=null;renderModal();render();window.scrollTo(0,0);break}
  case'askdel':ui.modal={type:'del',id:b.dataset.id};renderModal();break;
  case'del':{const id=b.dataset.id;delete GAMES[id];persistLocal();remoteDelete(id);if(S&&S.id===id)S=null;view='home';ui.modal=null;renderModal();render();break}
  case'draw':drawEvent();break;
  case'openpick':openPending();break;
  case'psel':{const k=b.dataset.k;if(m.kind==='sac2'){let sel=m.sel.slice();const op=k.split('|')[0];if(sel.length&&sel[0].split('|')[0]!==op)sel=[];const i=sel.indexOf(k);if(i>=0)sel.splice(i,1);else{if(sel.length>=2)sel.shift();sel.push(k)}m.sel=sel}else m.sel=k;renderModal();break}
  case'gthrow':{m.phase='spin';m.d=r6();renderModal();const mm=m;setTimeout(()=>{if(ui.modal===mm){mm.phase='done';renderModal();setTimeout(()=>{if(ui.modal===mm)gambleResolve(mm.d)},900)}},1200);break}
  case'gval':gambleResolve(+b.dataset.v);break;
  case'spin':spinSlots(m);break;
  case'rcthrow':{m.phase='spin';m.d=r6();renderModal();const mm=m;setTimeout(()=>{if(ui.modal===mm){mm.phase='done';renderModal();setTimeout(()=>{if(ui.modal===mm)rcountResolve(mm.d)},1000)}},1200);break}
  case'rcval':rcountResolve(+b.dataset.v);break;
  case'betv':{const t=S.turn,p=S.players[S.cur],st=+b.dataset.v;const cats=shuffle3(betCats(p));t.bet={stake:st,cats:cats.map(c=>c.id)};t.pending=null;t.note='Einsatz '+st+' auf: '+cats.map(c=>'„'+c.name+'“').join(', ')+'. Du darfst diese Runde nur hier werten – schaffst du eine, gibt es +'+st+', sonst −'+st+'.';ui.modal=null;renderModal();save();render();break}
  case'dthrow':{m.phase='spin';renderModal();const mm=m;setTimeout(()=>{if(ui.modal!==mm)return;mm.cont.forEach(i=>mm.vals[i]=r6());duelEval(mm);renderModal();render()},1100);break}
  case'dval':m.vals[+b.dataset.pi]=+b.dataset.v;renderModal();break;
  case'deval':duelEval(m);renderModal();render();break;
  case'dclose':ui.modal=null;renderModal();render();break;
  case'pok':applyPick(m.kind,m.sel);break;
  case'startv':{const t=S.turn;t.dice[0]=+b.dataset.v;t.held[0]=true;t.fixed=0;t.startPick=false;save();render();break}
  case'roll':roll();break;
  case'die':dieTap(+b.dataset.i);break;
  case'tool':{const t=S.turn,k=b.dataset.t;if(t.tool===k){t.tool=null;if(k==='joker'&&t.jokerDice.length)t.jokerUsed=true;if(k==='mirror'&&(t.mirDice||[]).length)t.mirUsed=true}else t.tool=k;save();render();break}
  case'cat':catTap(b.dataset.id);break;
  case'ddtoggle':ui.openList=!ui.openList;render();break;
  case'viewp':{const i=+b.dataset.i;ui.viewP=(i===S.cur)?null:i;render();window.scrollTo(0,0);break}
  case'edit':{const pi=+b.dataset.pi,e=S.players[pi].sc[b.dataset.id];if(!e)return;ui.modal={type:'edit',pi,id:b.dataset.id,val:String(e.final)};renderModal();break}
  case'editok':{const v=m.val;if(v===''||isNaN(v)||!Number.isInteger(+v)){document.getElementById('err').textContent='Bitte eine ganze Zahl eingeben.';return}
   const q=S.players[m.pi],e=q.sc[m.id],n=+v;if(n!==e.final){e.final=n;e.raw=n;e.tag=n===0?'✕':'✎'}ui.modal=null;renderModal();save();render();toast('Wertung geändert');break}
  case'editdel':{const q=S.players[m.pi];delete q.sc[m.id];ui.modal=null;renderModal();save();render();toast('Eintrag entfernt – die Kategorie ist wieder frei');break}
  case'ok':commit(m.id,m.raw,m.fromDice?{dice:true,rolls:m.rolls}:{});break;
  case'opendice':{const t=S.turn;if(!t.drawn){toast('Zieh zuerst deine Ereigniskarte');return}if(t.pending){openPending();return}ui.modal={type:'dice',d:(t.mdice||[]).slice(),rolls:t.mrolls||t.max};renderModal();break}
  case'dpush':if(m.d.length<6){m.d.push(+b.dataset.v);S.turn.mdice=m.d.slice();save();renderModal()}break;
  case'dpop':m.d.pop();S.turn.mdice=m.d.slice();save();renderModal();break;
  case'drolls':m.rolls=+b.dataset.v;S.turn.mrolls=m.rolls;renderModal();break;
  case'dcat':{const c=CAT[b.dataset.id];S.turn.dice=m.d.slice();ui.modal={type:'confirm',id:c.id,raw:c.calc(m.d),fromDice:true,rolls:m.rolls};renderModal();break}
  case'retry':retryTurn();break;
  case'need':{const v=+b.dataset.v;if(m.need==='fate')m.ctx.fdie=v;else if(m.need==='thief')m.ctx.target=v;else m.ctx.n=v;commit(m.id,m.raw,m.ctx);break}
  case'needmix':{const er=validate(CAT[m.ctx.mixId],m.val);if(er){document.getElementById('err').textContent=er;return}m.ctx.mixVal=+m.val;commit(m.id,m.raw,m.ctx);break}
  case'qv':{m.val=b.dataset.v;document.getElementById('numin').value=b.dataset.v;document.querySelectorAll('.quick button').forEach(x=>x.classList.toggle('on',x===b));document.getElementById('err').textContent='';updatePreview();break}
  case'mrolls':m.rolls=+b.dataset.v;renderModal();break;
  case'mkb':m.kb=!m.kb;renderModal();break;
  case'mke':m.ke=!m.ke;renderModal();break;
  case'okin':{const er=validate(CAT[m.id],m.val);if(er){document.getElementById('err').textContent=er;return}commit(m.id,+m.val,{rolls:m.rolls,kb:m.kb,ke:m.ke});break}
  case'board':ui.modal={type:'board'};renderModal();break;
  case'menu':ui.modal={type:'menu'};renderModal();break;
  case'close':ui.modal=null;renderModal();break;
  case'home':ui.modal=null;renderModal();mpLeave();S=null;setup.online=false;view='home';render();window.scrollTo(0,0);break;
  case'again':{const names=S.players.map(p=>p.name),mode=S.mode,ev=S.events;newGame(names,mode,ev);window.scrollTo(0,0);break}
 }});
render();
initCloud();
</script>
</body>
</html>
